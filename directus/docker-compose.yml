# Directus admin CMS for Brick Engaged
# Connects to existing Supabase Postgres via direct IPv6 connection

services:
  directus:
    image: directus/directus:11
    ports:
      - "8055:8055"
    volumes:
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions
    environment:
      KEY: "brick-engaged-directus-key-change-me"
      SECRET: "brick-engaged-directus-secret-change-me"

      # Supabase direct connection (IPv6 — works on Railway)
      DB_CLIENT: "pg"
      DB_HOST: "db.snqgkxadkramdlqhokrd.supabase.co"
      DB_PORT: "5432"
      DB_DATABASE: "postgres"
      DB_USER: "postgres"
      DB_PASSWORD: "yLFyWd71BUprmU1H"
      DB_SSL: "true"

      # Directus admin
      PUBLIC_URL: "http://localhost:8055"
      ADMIN_EMAIL: "dan@brickengaged.org"
      ADMIN_PASSWORD: "BrickEngagedAdmin2026!"

    restart: unless-stopped
